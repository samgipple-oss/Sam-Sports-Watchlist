
name: Refresh sports fixtures

on:
  schedule:
    # Refresh every 3 hours
    - cron: '17 */3 * * *'

  # Allow manual updates from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sports-fixture-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch public sports fixtures
        run: python scripts/update_fixtures.py

      - name: Commit updated schedule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-fixtures.json
          if ! git diff --cached --quiet; then
            git commit -m "Update rolling sports schedule"
            git push
          fi
